version: '3.8'

services:
  postgres_db_local:
    image: postgres:16-alpine
    container_name: postgres_db_local
    restart: always
    ports:
      - "6666:5432"
    environment:
      POSTGRES_DB: busbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d busbooking"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - busbooking-network

  redis_local:
    image: redis:7-alpine
    container_name: redis_local
    restart: always
    ports:
      - "6379:6379"
    networks:
      - busbooking-network

  backend:
    build: .
    container_name: busbooking_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres_db_local
      DB_PORT: 5432
      REDIS_HOST: redis_local
    depends_on:
      - postgres_db_local
      - redis_local
    networks:
      - busbooking-network

volumes:
  postgres_data:

networks:
  busbooking-network:
    driver: bridge
