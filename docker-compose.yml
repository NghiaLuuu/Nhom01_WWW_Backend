services:
  postgres_db_local:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    container_name: postgres_db_local
    restart: always
    ports:
      - "6666:5432"
    environment:
      POSTGRES_DB: busbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d busbooking"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - busbooking-network

  redis_local:
    image: redis:7-alpine
    container_name: redis_local
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - busbooking-network

  backend:
    build: .
    container_name: busbooking_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres_db_local
      DB_PORT: 5432
      REDIS_HOST: redis_local
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres_db_local:
        condition: service_healthy
      redis_local:
        condition: service_healthy
    networks:
      - busbooking-network

volumes:
  postgres_data:
    name: nhom01_www_backend_postgres_data
    external: true

networks:
  busbooking-network:
    name: nhom01_www_backend_busbooking-network
    driver: bridge
