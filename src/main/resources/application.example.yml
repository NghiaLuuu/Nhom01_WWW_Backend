spring:
  application:
    name: busbooking
  datasource:
    url: jdbc:postgresql://localhost:6666/busbooking
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: always
      platform: postgresql

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
  expiration: 3600000
  refresh-expiration: 604800000

spring.ai:
  vectorstore:
    # Keep PgVectorStore disabled until PostgreSQL has the pgvector extension and
    # docker/postgres/migrations/002-create-vector-store.sql has been applied.
    type: none
  openai:
    api-key: ${OPENAI_API_KEY}
    chat:
      model: gpt-4o-mini

server:
  address: 0.0.0.0
  port: 8080

app:
  cors:
    # Override CORS_ALLOWED_ORIGIN_PATTERNS in production with the exact admin-web origins.
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],http://172.*.*.*:[*]}"

booking:
  cutoff:
    web-minutes-before: 30 # Allowed range: 30 - 60
    pos-minutes-before: 10 # Allowed range: 10 - 15
