spring:
  application:
    name: busbooking
  datasource:
    url: jdbc:postgresql://localhost:6666/busbooking
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 30000
      leak-detection-threshold: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: always
      platform: postgresql

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
  expiration: 3600000
  refresh-expiration: 604800000

spring.ai:
  vectorstore:
    # Keep PgVectorStore disabled until PostgreSQL has the pgvector extension and
    # docker/postgres/migrations/002-create-vector-store.sql has been applied.
    type: none
  openai:
    api-key: ${OPENAI_API_KEY}
    chat:
      model: gpt-4o-mini
      
ticket:
  checkin:
    open-minutes-before: 60 # Mở cổng soát vé: 30 - 60 phút trước giờ khởi hành
    close-minutes-before: 10 # Đóng cổng soát vé: Trước giờ xe xuất bến từ 5 – 10 phút để tài xế/phụ xe chốt danh sách hành khách và xếp hành lý
  noshow:
    reschedule-fee-percent: 20 # Phí đổi vé No-show: 20% giá vé gốc
    min-reschedule-fee: 30000 # Mức phí đổi vé tối thiểu: 30.000 VNĐ

booking:
  cutoff:
    web-minutes-before: 30 # Cho phép cấu hình trong khoảng 30 - 60 phút
    pos-minutes-before: 10 # Cho phép cấu hình trong khoảng 10 - 15 phút

app:
  demo-payment:
    enabled: true
